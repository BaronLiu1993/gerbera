component_type: dcmotor

capabilities:
  streaming: false

libraries: []

pins:
  in1:
    mode: OUTPUT
    capabilities: [digital_output]
    assignment: exclusive
  in2:
    mode: OUTPUT
    capabilities: [digital_output]
    assignment: exclusive
  enable:
    mode: OUTPUT
    capabilities: [digital_output, pwm_output]
    assignment: exclusive

state:
  fields:
    motor_state:
      unit: null
      domain:
        kind: choice
        values: [-1, 0, 1]

commands:
  - method: WRITE
    response_fields: [motor_state]
    enabled_when: always
    description: Set brushed DC motor direction and speed. Use direction 1 for forward, -1 for reverse, and 0 for stop.
    params:
      direction:
        required: true
        domain:
          kind: choice
          values: [-1, 0, 1]
        description: 1 drives forward; -1 drives reverse; 0 stops.
      speed:
        required: false
        domain:
          kind: integer_range
          minimum: 0
          maximum: 255
        description: PWM speed from 0 to 255.
    annotations:
      title: Set {connection.name} motor motion
      read_only_hint: false
      open_world_hint: false

verification:
  startup_timeout_ms: 100
  monitor_interval_ms: 100
  check: |
    return false;
  monitor: |
    return false;
  safe_stop: |
    digitalWrite({pins.in1}, LOW);
    digitalWrite({pins.in2}, LOW);
    analogWrite({pins.enable}, 0);

firmware:
  definitions: ""
  definitions_when_streaming: ""
  setup: []
  setup_when_streaming: []
  stream_loop_when_streaming: ""
  handlers:
    default: |
      void handle_{connection.name}(const String& input) {
        String directionValue = parameterValue(input, "direction");
        String speedValue = parameterValue(input, "speed");
        int speed = 255;

        if (directionValue.length() == 0) {
          sendMcpResponse(input, "{connection.event_name}", "error", "invalid_arg");
          return;
        }

        float direction = directionValue.toFloat();

        if (speedValue.length() > 0) {
          speed = speedValue.toInt();
          if (speed < 0) {
            speed = 0;
          }
          if (speed > 255) {
            speed = 255;
          }
        }

        if (direction == 1) {
          digitalWrite({pins.in1}, HIGH);
          digitalWrite({pins.in2}, LOW);
          analogWrite({pins.enable}, speed);
          sendMcpResponse(input, "{connection.event_name}", "motor_state", "1");
          return;
        }

        if (direction == -1) {
          digitalWrite({pins.in1}, LOW);
          digitalWrite({pins.in2}, HIGH);
          analogWrite({pins.enable}, speed);
          sendMcpResponse(input, "{connection.event_name}", "motor_state", "-1");
          return;
        }

        if (direction == 0) {
          digitalWrite({pins.in1}, LOW);
          digitalWrite({pins.in2}, LOW);
          analogWrite({pins.enable}, 0);
          sendMcpResponse(input, "{connection.event_name}", "motor_state", "0");
          return;
        }

        sendMcpResponse(input, "{connection.event_name}", "error", "invalid_direction");
      }

stream:
  payload_fields: []
  schema: {}
