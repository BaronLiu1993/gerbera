component_type: hcsr04

capabilities:
  streaming: true

libraries: []

pins:
  trig:
    mode: OUTPUT
    capabilities: [digital_output]
    assignment: exclusive
  echo:
    mode: INPUT
    capabilities: [digital_input]
    assignment: exclusive

state:
  units:
    distance: cm
    stream_enabled: null

commands:
  - method: READ
    enabled_when: always
    description: Read distance from the HC-SR04 ultrasonic sensor.
    params: {}
    annotations:
      title: Read current distance from {connection.name}
      readOnlyHint: true
      openWorldHint: false
  - method: WRITE
    enabled_when: stream_enabled
    description: Set continuous HC-SR04 streaming. Use state 1 for on and 0 for off.
    params:
      state:
        required: true
        min: 0
        max: 1
        description: 1 turns continuous HC-SR04 streaming on; 0 turns it off.
    annotations:
      title: Set {connection.name} stream state
      readOnlyHint: false
      openWorldHint: false

verification:
  startup_timeout_ms: 50
  monitor_interval_ms: 250
  check: |
    digitalWrite({pins.trig}, LOW);
    delayMicroseconds(2);
    digitalWrite({pins.trig}, HIGH);
    delayMicroseconds(10);
    digitalWrite({pins.trig}, LOW);
    return pulseIn({pins.echo}, HIGH, 30000) > 0;
  monitor: |
    digitalWrite({pins.trig}, LOW);
    delayMicroseconds(2);
    digitalWrite({pins.trig}, HIGH);
    delayMicroseconds(10);
    digitalWrite({pins.trig}, LOW);
    return pulseIn({pins.echo}, HIGH, 30000) > 0;
  safe_stop: |
    digitalWrite({pins.trig}, LOW);

firmware:
  definitions_when_streaming: |
    bool {connection.name}_stream_on = false;
  stream_loop_when_streaming: |
      if ({connection.name}_stream_on) {
        digitalWrite({pins.trig}, LOW);
        delayMicroseconds(2);
        digitalWrite({pins.trig}, HIGH);
        delayMicroseconds(10);
        digitalWrite({pins.trig}, LOW);
        long duration = pulseIn({pins.echo}, HIGH, 30000);
        if (duration > 0) {
          float distanceCm = duration * 0.0343 / 2.0;
          GERBERA_TRANSPORT.print("STREAM,{connection.event_name},distance:");
          GERBERA_TRANSPORT.println(distanceCm);
        }
        delay(100);
      }
  handlers:
    default: |
      void handle_{connection.name}(const String& input) {
        (void)input;
        digitalWrite({pins.trig}, LOW);
        delayMicroseconds(2);
        digitalWrite({pins.trig}, HIGH);
        delayMicroseconds(10);
        digitalWrite({pins.trig}, LOW);
        long duration = pulseIn({pins.echo}, HIGH, 30000);
        if (duration == 0) {
          GERBERA_TRANSPORT.println("MCP,{connection.event_name},error:timeout");
          return;
        }

        float distanceCm = duration * 0.0343 / 2.0;
        GERBERA_TRANSPORT.print("MCP,{connection.event_name},distance:");
        GERBERA_TRANSPORT.println(distanceCm);
      }
    streaming: |
      void handle_{connection.name}(const String& input) {
        String action = actionOf(input);

        if (action == "WRITE") {
          String stateValue = parameterValue(input, "state");
          if (stateValue.length() == 0) {
            GERBERA_TRANSPORT.println("MCP,{connection.event_name},error:invalid_arg");
            return;
          }

          float state = stateValue.toFloat();
          if (state == 1) {
            {connection.name}_stream_on = true;
            GERBERA_TRANSPORT.println("MCP,{connection.event_name},stream_enabled:1");
            return;
          }

          if (state == 0) {
            {connection.name}_stream_on = false;
            GERBERA_TRANSPORT.println("MCP,{connection.event_name},stream_enabled:0");
            return;
          }

          GERBERA_TRANSPORT.println("MCP,{connection.event_name},error:invalid_state");
          return;
        }

        digitalWrite({pins.trig}, LOW);
        delayMicroseconds(2);
        digitalWrite({pins.trig}, HIGH);
        delayMicroseconds(10);
        digitalWrite({pins.trig}, LOW);
        long duration = pulseIn({pins.echo}, HIGH, 30000);
        if (duration == 0) {
          GERBERA_TRANSPORT.println("MCP,{connection.event_name},error:timeout");
          return;
        }

        float distanceCm = duration * 0.0343 / 2.0;
        GERBERA_TRANSPORT.print("MCP,{connection.event_name},distance:");
        GERBERA_TRANSPORT.println(distanceCm);
      }

stream:
  schema:
    id:
      type: INTEGER
      primary_key: true
      nullable: false
      sql_suffix: GENERATED BY DEFAULT AS IDENTITY
    value:
      type: DOUBLE PRECISION
      idx: true
      nullable: false
    created_at:
      type: TIMESTAMP
      idx: true
      nullable: false
