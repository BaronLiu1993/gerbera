component_type: sg90

capabilities:
  streaming: false

libraries:
  - include: Servo.h
    install: Servo

pins:
  signal:
    mode: OUTPUT
    capabilities: [digital_output]
    assignment: exclusive

state:
  units:
    angle: radians

commands:
  - method: WRITE
    enabled_when: always
    description: Set servo angle.
    params:
      angle:
        required: true
        min: 0
        max: 3.141592653589793
        description: Servo angle in radians.
    annotations:
      title: Set {connection.name} servo angle
      readOnlyHint: false
      openWorldHint: false

verification:
  startup_timeout_ms: 100
  monitor_interval_ms: 100
  check: |
    return false;
  monitor: |
    return false;
  safe_stop: |
    {connection.name}_servo.detach();
    digitalWrite({pins.signal}, LOW);

firmware:
  definitions: |
    Servo {connection.name}_servo;
  handlers:
    default: |
      void handle_{connection.name}(const String& input) {
        String angleValue = parameterValue(input, "angle");

        if (angleValue.length() == 0) {
          Serial.println("MCP,{connection.event_name},error:invalid_arg");
          return;
        }

        int angle = angleValue.toInt();
        if (!{connection.name}_servo.attached()) {
          {connection.name}_servo.attach({pins.signal});
        }
        {connection.name}_servo.write(angle);
        Serial.print("MCP,{connection.event_name},angle:");
        Serial.println(angle);
      }

stream:
  schema: {}
