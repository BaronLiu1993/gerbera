component_type: led

capabilities:
  streaming: false

libraries: []

pins:
  out: OUTPUT

state:
  units:
    led_state: null

commands:
  - method: WRITE
    description: Set the LED state.
    params:
      state:
        required: true
        min: 0
        max: 1
        description: 1 turns the LED on; 0 turns it off.
    annotations:
      title: Set {connection.name} LED state
      readOnlyHint: false
      openWorldHint: false

firmware:
  handlers:
    default: |
      void handle_{connection.name}(const String& input) {
        String stateValue = parameterValue(input, "state");

        if (stateValue.length() == 0) {
          Serial.println("MCP,{connection.event_name},error:invalid_arg");
          return;
        }

        float state = stateValue.toFloat();

        if (state == 1) {
          digitalWrite({pins.out}, HIGH);
          Serial.println("MCP,{connection.event_name},led_state:1");
          return;
        }

        if (state == 0) {
          digitalWrite({pins.out}, LOW);
          Serial.println("MCP,{connection.event_name},led_state:0");
          return;
        }

        Serial.println("MCP,{connection.event_name},error:invalid_state");
      }

stream:
  schema: {}
