component_type: led

capabilities:
  streaming: false

libraries: []

pins:
  out:
    mode: OUTPUT
    capabilities: [digital_output]
    assignment: exclusive

state:
  fields:
    led_state:
      unit: null
      domain:
        kind: choice
        values: [0, 1]

commands:
  - method: WRITE
    response_fields: [led_state]
    enabled_when: always
    description: Set the LED state.
    params:
      state:
        required: true
        domain:
          kind: choice
          values: [0, 1]
        description: 1 turns the LED on; 0 turns it off.
    annotations:
      title: Set {connection.name} LED state
      read_only_hint: false
      open_world_hint: false

verification:
  startup_timeout_ms: 100
  monitor_interval_ms: 250
  check: |
    return false;
  monitor: |
    return false;
  safe_stop: |
    digitalWrite({pins.out}, LOW);

firmware:
  definitions: ""
  definitions_when_streaming: ""
  setup: []
  setup_when_streaming: []
  stream_loop_when_streaming: ""
  handlers:
    default: |
      void handle_{connection.name}(const String& input) {
        String stateValue = parameterValue(input, "state");

        if (stateValue.length() == 0) {
          sendMcpResponse(input, "{connection.event_name}", "error", "invalid_arg");
          return;
        }

        float state = stateValue.toFloat();

        if (state == 1) {
          digitalWrite({pins.out}, HIGH);
          sendMcpResponse(input, "{connection.event_name}", "led_state", "1");
          return;
        }

        if (state == 0) {
          digitalWrite({pins.out}, LOW);
          sendMcpResponse(input, "{connection.event_name}", "led_state", "0");
          return;
        }

        sendMcpResponse(input, "{connection.event_name}", "error", "invalid_state");
      }

stream:
  payload_fields: []
  schema: {}
