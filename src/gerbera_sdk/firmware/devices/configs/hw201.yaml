component_type: hw201

capabilities:
  streaming: true

libraries: []

pins:
  out:
    mode: INPUT
    capabilities: [digital_input]
    assignment: exclusive

state:
  fields:
    obstacle_detected:
      unit: null
      domain:
        kind: choice
        values: [0, 1]
    stream_enabled:
      unit: null
      domain:
        kind: choice
        values: [0, 1]

commands:
  - method: READ
    response_fields: [obstacle_detected]
    enabled_when: always
    description: Read the current digital sensor value.
    params: {}
    annotations:
      title: Read current value from {connection.name}
      read_only_hint: true
      open_world_hint: false
  - method: WRITE
    response_fields: [stream_enabled]
    enabled_when: stream_enabled
    description: Set continuous HW201 streaming. Use state 1 for on and 0 for off.
    params:
      state:
        required: true
        domain:
          kind: choice
          values: [0, 1]
        description: 1 turns continuous HW201 streaming on; 0 turns it off.
    annotations:
      title: Set {connection.name} stream state
      read_only_hint: false
      open_world_hint: false

verification:
  startup_timeout_ms: 100
  monitor_interval_ms: 250
  check: |
    return false;
  monitor: |
    return false;
  safe_stop: ""

firmware:
  definitions: ""
  setup: []
  setup_when_streaming: []
  definitions_when_streaming: |
    bool {connection.name}_stream_on = false;
  stream_loop_when_streaming: |
      if ({connection.name}_stream_on) {
        int value = digitalRead({pins.out});
        GERBERA_TRANSPORT.print("STREAM,{connection.event_name},obstacle_detected:");
        GERBERA_TRANSPORT.println(value);
        delay(100);
      }
  handlers:
    default: |
      void handle_{connection.name}(const String& input) {
        int value = digitalRead({pins.out});
        sendMcpResponse(input, "{connection.event_name}", "obstacle_detected", String(value));
      }
    streaming: |
      void handle_{connection.name}(const String& input) {
        String action = actionOf(input);

        if (action == "WRITE") {
          String stateValue = parameterValue(input, "state");
          if (stateValue.length() == 0) {
            sendMcpResponse(input, "{connection.event_name}", "error", "invalid_arg");
            return;
          }

          float state = stateValue.toFloat();
          if (state == 1) {
            {connection.name}_stream_on = true;
            sendMcpResponse(input, "{connection.event_name}", "stream_enabled", "1");
            return;
          }

          if (state == 0) {
            {connection.name}_stream_on = false;
            sendMcpResponse(input, "{connection.event_name}", "stream_enabled", "0");
            return;
          }

          sendMcpResponse(input, "{connection.event_name}", "error", "invalid_state");
          return;
        }

        int value = digitalRead({pins.out});
        sendMcpResponse(input, "{connection.event_name}", "obstacle_detected", String(value));
      }

stream:
  payload_fields: [obstacle_detected]
  schema:
    id:
      type: INTEGER
      primary_key: true
      nullable: false
      sql_suffix: GENERATED BY DEFAULT AS IDENTITY
      idx: false
      default: null
    value:
      type: INTEGER
      idx: true
      nullable: false
      primary_key: false
      default: null
      sql_suffix: null
    created_at:
      type: TIMESTAMP
      idx: true
      nullable: false
      primary_key: false
      default: null
      sql_suffix: null
