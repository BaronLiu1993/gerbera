component_type: hw201

capabilities:
  streaming: true

libraries: []

pins:
  out:
    mode: INPUT

state:
  units:
    obstacle_detected: null
    stream_enabled: null

commands:
  - method: READ
    enabled_when: always
    description: Read the current digital sensor value.
    params: {}
    annotations:
      title: Read current value from {connection.name}
      readOnlyHint: true
      openWorldHint: false
  - method: WRITE
    enabled_when: stream_enabled
    description: Set continuous HW201 streaming. Use state 1 for on and 0 for off.
    params:
      state:
        required: true
        min: 0
        max: 1
        description: 1 turns continuous HW201 streaming on; 0 turns it off.
    annotations:
      title: Set {connection.name} stream state
      readOnlyHint: false
      openWorldHint: false

firmware:
  definitions_when_streaming: |
    bool {connection.name}_stream_on = false;
  stream_loop_when_streaming: |
      if ({connection.name}_stream_on) {
        int value = digitalRead({pins.out});
        Serial.print("STREAM,{connection.event_name},obstacle_detected:");
        Serial.println(value);
        delay(100);
      }
  handlers:
    default: |
      void handle_{connection.name}(const String& input) {
        (void)input;
        int value = digitalRead({pins.out});
        Serial.print("MCP,{connection.event_name},obstacle_detected:");
        Serial.println(value);
      }
    streaming: |
      void handle_{connection.name}(const String& input) {
        String action = actionOf(input);

        if (action == "WRITE") {
          String stateValue = parameterValue(input, "state");
          if (stateValue.length() == 0) {
            Serial.println("MCP,{connection.event_name},error:invalid_arg");
            return;
          }

          float state = stateValue.toFloat();
          if (state == 1) {
            {connection.name}_stream_on = true;
            Serial.println("MCP,{connection.event_name},stream_enabled:1");
            return;
          }

          if (state == 0) {
            {connection.name}_stream_on = false;
            Serial.println("MCP,{connection.event_name},stream_enabled:0");
            return;
          }

          Serial.println("MCP,{connection.event_name},error:invalid_state");
          return;
        }

        int value = digitalRead({pins.out});
        Serial.print("MCP,{connection.event_name},obstacle_detected:");
        Serial.println(value);
      }

stream:
  schema:
    id:
      type: INTEGER
      primary_key: true
      nullable: false
      sql_suffix: GENERATED BY DEFAULT AS IDENTITY
    value:
      type: INTEGER
      idx: true
      nullable: false
    created_at:
      type: TIMESTAMP
      idx: true
      nullable: false
