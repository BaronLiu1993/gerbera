definitions: |
  unsigned long ${symbol}_pulse() {
    digitalWrite($trig, LOW);
    delayMicroseconds(2);
    digitalWrite($trig, HIGH);
    delayMicroseconds(10);
    digitalWrite($trig, LOW);
    return pulseIn($echo, HIGH, 30000);
  }
setup: digitalWrite($trig, LOW);
pin_modes:
  trig: OUTPUT
  echo: INPUT
stream:
  field: distance
  unit: cm
  body: |
    unsigned long duration = ${symbol}_pulse();
    if (duration > 0) {
      sendMessage("STREAM", $target, $response_field, String(duration * 0.0343 / 2.0));
    }
    delay(100);
