setup: |
  digitalWrite($in1, LOW);
  digitalWrite($in2, LOW);
  analogWrite($enable, 0);
pin_modes:
  in1: OUTPUT
  in2: OUTPUT
  enable: OUTPUT
write:
  response_field: motor_state
  body: |
    String direction = command.field("direction");
    if (direction.length() == 0) {
      sendMessage("MCP", $target, "error", "invalid_arg");
      return;
    }
    if (direction != "-1" && direction != "0" && direction != "1") {
      sendMessage("MCP", $target, "error", "invalid_direction");
      return;
    }
    String speedValue = command.field("speed");
    int speed = 255;
    if (speedValue.length() > 0) {
      speed = constrain(speedValue.toInt(), 0, 255);
    }
    digitalWrite($in1, direction == "1" ? HIGH : LOW);
    digitalWrite($in2, direction == "-1" ? HIGH : LOW);
    analogWrite($enable, direction == "0" ? 0 : speed);
    sendMessage("MCP", $target, $response_field, direction);
  params:
    direction:
      required: true
      choices:
      - -1
      - 0
      - 1
    speed:
      required: false
      minimum: 0
      maximum: 255
